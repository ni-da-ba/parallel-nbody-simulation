name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned formatter
        run: python -m pip install clang-format==15.0.7
      - name: Install native tooling
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Check C++ formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: MPI smoke tests
        run: |
          mpirun --oversubscribe -np 2 ./build/nbody allpairs 8 2 0.001
          mpirun --oversubscribe -np 2 ./build/nbody barneshut 8 2 0.001 0.5
      - name: Check plotting scripts
        run: python -m py_compile plots/plot_results.py plots/plot_snapshots.py
